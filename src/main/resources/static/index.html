<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialDev Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <div id="app"></div>

    <script>
        // ===== CONFIGURATION =====
        const API_URL = 'http://localhost:8080/api';
        const WS_URL = 'http://localhost:8080/ws-socialdev';
        const MAX_MESSAGE_LENGTH = 1000;

        // ===== CACHED DOM ELEMENTS =====
        const appElement = document.getElementById('app');

        // ===== APPLICATION STATE =====
        const AppState = {
            user: null,
            stompClient: null,
            selectedUser: null,
            isPrivateMode: false,

            setUser(newUser) {
                this.user = newUser;
                if (newUser) {
                    localStorage.setItem('socialdev_user', JSON.stringify(newUser));
                } else {
                    localStorage.removeItem('socialdev_user');
                }
            },

            getUser() {
                if (!this.user) {
                    const saved = localStorage.getItem('socialdev_user');
                    if (saved) {
                        try {
                            this.user = JSON.parse(saved);
                        } catch (e) {
                            console.error('Failed to parse saved user:', e);
                            localStorage.removeItem('socialdev_user');
                        }
                    }
                }
                return this.user;
            },

            clear() {
                this.user = null;
                this.stompClient = null;
                this.selectedUser = null;
                this.isPrivateMode = false;
                localStorage.removeItem('socialdev_user');
            }
        };

        // ===== API UTILITIES =====
        async function apiCall(endpoint, options = {}) {
            try {
                const response = await fetch(`${API_URL}${endpoint}`, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    credentials: 'include',
                    ...options
                });

                if (!response.ok) {
                    const error = await response.json().catch(() => ({ message: 'Request failed' }));
                    throw new Error(error.message || `HTTP ${response.status}`);
                }

                return await response.json();
            } catch (error) {
                console.error(`API Error [${endpoint}]:`, error);
                throw error;
            }
        }

        // ===== UTILITY FUNCTIONS =====
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function validateAuthInput(username, password) {
            const trimmedUsername = username.trim();
            const trimmedPassword = password.trim();

            if (!trimmedUsername || !trimmedPassword) {
                throw new Error('Username and password are required');
            }

            if (trimmedUsername.length < 3) {
                throw new Error('Username must be at least 3 characters');
            }

            if (trimmedPassword.length < 6) {
                throw new Error('Password must be at least 6 characters');
            }

            return { username: trimmedUsername, password: trimmedPassword };
        }

        function validateMessageContent(content) {
            const trimmed = content.trim();

            if (!trimmed) {
                throw new Error('Message cannot be empty');
            }

            if (trimmed.length > MAX_MESSAGE_LENGTH) {
                throw new Error(`Message too long (max ${MAX_MESSAGE_LENGTH} characters)`);
            }

            return trimmed;
        }

        function showLoading(message = 'Loading...') {
            appElement.innerHTML = `
                <div class="min-h-screen flex items-center justify-center">
                    <div class="text-center">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto mb-4"></div>
                        <p class="text-gray-600">${escapeHtml(message)}</p>
                    </div>
                </div>
            `;
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'fixed top-4 right-4 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg z-50';
            errorDiv.textContent = message;
            document.body.appendChild(errorDiv);

            setTimeout(() => errorDiv.remove(), 5000);
        }

        function showSuccess(message) {
            const successDiv = document.createElement('div');
            successDiv.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg z-50';
            successDiv.textContent = message;
            document.body.appendChild(successDiv);

            setTimeout(() => successDiv.remove(), 3000);
        }

        // ===== WEBSOCKET FUNCTIONS =====
        async function connectWebSocket() {
            const user = AppState.getUser();
            if (!user || AppState.stompClient) return;

            return new Promise((resolve, reject) => {
                const socket = new SockJS(WS_URL);
                const client = Stomp.over(socket);

                client.connect({},
                    () => {
                        AppState.stompClient = client;

                        // Subscribe to public messages
                        client.subscribe('/topic/public', (message) => {
                            const msg = JSON.parse(message.body);
                            displayMessage(msg, false);
                        });

                        // Subscribe to private messages
                        client.subscribe(`/queue/private`, (message) => {
                            const msg = JSON.parse(message.body);
                            displayMessage(msg, true);
                        });

                        resolve(client);
                    },
                    (error) => {
                        console.error('WebSocket connection error:', error);
                        reject(error);
                    }
                );
            });
        }

        function displayMessage(message, isPrivate) {
            const user = AppState.getUser();
            const messagesContainer = document.getElementById('messages-container');

            if (!messagesContainer) return;

            // Check if this message belongs to current conversation
            if (isPrivate) {
                const inConversation = (
                    (AppState.selectedUser &&
                        (message.senderName === AppState.selectedUser.username ||
                            message.recipientName === AppState.selectedUser.username))
                );
                if (!inConversation) return;
            } else {
                if (AppState.isPrivateMode) return;
            }

            const isOwn = message.senderName === user.username;
            messagesContainer.innerHTML += createMessageHTML(message, isOwn);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // ===== TEMPLATE FUNCTIONS =====
        function createMessageHTML(message, isOwn) {
            const alignment = isOwn ? 'justify-end' : 'justify-start';
            const bgColor = isOwn ? 'bg-blue-500 text-white' : 'bg-white';

            return `
                <div class="flex ${alignment} mb-4">
                    <div class="${bgColor} rounded-lg p-3 max-w-xs lg:max-w-md shadow">
                        <p class="font-semibold text-sm mb-1">${escapeHtml(message.senderName)}</p>
                        <p class="break-words">${escapeHtml(message.content)}</p>
                        <p class="text-xs opacity-75 mt-1">
                            ${new Date(message.createdAt).toLocaleTimeString()}
                        </p>
                    </div>
                </div>
            `;
        }

        function createUserListItemHTML(user, isSelected) {
            const currentUser = AppState.getUser();
            if (user.username === currentUser.username) return '';

            const activeClass = isSelected ? 'bg-blue-100 border-blue-500' : 'hover:bg-gray-50';

            return `
                <li class="border-b last:border-b-0">
                    <button 
                        onclick="selectUser(${user.id}, '${escapeHtml(user.username)}')"
                        class="w-full text-left px-4 py-3 transition ${activeClass} border-l-4 border-transparent">
                        <span class="font-medium">${escapeHtml(user.username)}</span>
                    </button>
                </li>
            `;
        }

        function createAuthFormHTML(isLogin) {
            const title = isLogin ? 'Login' : 'Register';
            const switchText = isLogin ? "Don't have an account?" : 'Already have an account?';
            const switchAction = isLogin ? 'Register' : 'Login';

            return `
                <div class="min-h-screen flex items-center justify-center p-4">
                    <div class="bg-white rounded-lg shadow-xl p-8 w-full max-w-md">
                        <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">SocialDev Chat</h1>

                        <form id="auth-form" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                                <input 
                                    type="text" 
                                    id="username" 
                                    required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    placeholder="Enter username">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                <input 
                                    type="password" 
                                    id="password" 
                                    required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    placeholder="Enter password">
                            </div>

                            <button 
                                type="submit" 
                                class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition font-medium">
                                ${title}
                            </button>
                        </form>

                        <div class="mt-4 text-center">
                            <span class="text-gray-600">${switchText}</span>
                            <button 
                                onclick="switchAuthMode()" 
                                class="text-blue-500 hover:text-blue-600 font-medium ml-1">
                                ${switchAction}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function createChatInterfaceHTML() {
            const user = AppState.getUser();
            const chatTitle = AppState.isPrivateMode && AppState.selectedUser
                ? `Chat with ${escapeHtml(AppState.selectedUser.username)}`
                : 'Public Chat';

            return `
                <div class="flex h-screen bg-gray-100">
                    <!-- Sidebar -->
                    <div class="w-80 bg-white border-r border-gray-200 flex flex-col">
                        <div class="p-4 border-b border-gray-200 bg-blue-500 text-white">
                            <h2 class="text-xl font-bold">SocialDev Chat</h2>
                            <p class="text-sm opacity-90">${escapeHtml(user.username)}</p>
                        </div>

                        <div class="flex-1 overflow-y-auto">
                            <button 
                                onclick="switchToPublic()"
                                class="w-full text-left px-4 py-3 border-b hover:bg-gray-50 transition ${!AppState.isPrivateMode ? 'bg-blue-100' : ''}">
                                <span class="font-medium">📢 Public Chat</span>
                            </button>

                            <div class="p-2 bg-gray-50 border-b">
                                <h3 class="text-sm font-semibold text-gray-600 px-2">Private Chats</h3>
                            </div>

                            <ul id="users-list"></ul>
                        </div>

                        <div class="p-4 border-t border-gray-200">
                            <button 
                                onclick="logout()"
                                class="w-full bg-red-500 text-white py-2 rounded-lg hover:bg-red-600 transition">
                                Logout
                            </button>
                        </div>
                    </div>

                    <!-- Chat Area -->
                    <div class="flex-1 flex flex-col">
                        <div class="bg-white border-b border-gray-200 px-6 py-4">
                            <h2 class="text-xl font-semibold text-gray-800">${chatTitle}</h2>
                        </div>

                        <div id="messages-container" class="flex-1 overflow-y-auto p-6 space-y-4"></div>

                        <div class="bg-white border-t border-gray-200 p-4">
                            <form id="message-form" class="flex gap-2">
                                <input 
                                    type="text" 
                                    id="message-input" 
                                    placeholder="Type a message..."
                                    class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    maxlength="${MAX_MESSAGE_LENGTH}">
                                <button 
                                    type="submit" 
                                    class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 transition font-medium">
                                    Send
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            `;
        }

        // ===== AUTHENTICATION =====
        let isLoginMode = true;

        async function handleAuth(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const { username: validUsername, password: validPassword } = validateAuthInput(username, password);

                showLoading(isLoginMode ? 'Logging in...' : 'Registering...');

                const endpoint = isLoginMode ? '/auth/login' : '/auth/register';
                const user = await apiCall(endpoint, {
                    method: 'POST',
                    body: JSON.stringify({ username: validUsername, password: validPassword })
                });

                AppState.setUser(user);
                showSuccess(isLoginMode ? 'Logged in successfully!' : 'Registered successfully!');
                await initializeChat();

            } catch (error) {
                showError(error.message);
                renderAuth();
            }
        }

        function switchAuthMode() {
            isLoginMode = !isLoginMode;
            renderAuth();
        }

        // ===== CHAT FUNCTIONS =====
        async function initializeChat() {
            try {
                showLoading('Connecting to chat...');

                await connectWebSocket();
                await loadUsers();
                await loadPublicMessages();

                renderChat();
                setupChatListeners();

            } catch (error) {
                showError('Failed to initialize chat');
                console.error(error);
                logout();
            }
        }

        async function loadPublicMessages() {
            try {
                const messages = await apiCall('/messages/public');
                const container = document.getElementById('messages-container');
                if (container) {
                    const user = AppState.getUser();
                    container.innerHTML = messages
                        .map(msg => createMessageHTML(msg, msg.senderName === user.username))
                        .join('');
                    container.scrollTop = container.scrollHeight;
                }
            } catch (error) {
                showError('Failed to load messages');
            }
        }

        async function loadUsers() {
            try {
                const users = await apiCall('/users');
                const usersList = document.getElementById('users-list');
                if (usersList) {
                    const selectedId = AppState.selectedUser?.id;
                    usersList.innerHTML = users
                        .map(user => createUserListItemHTML(user, user.id === selectedId))
                        .join('');
                }
            } catch (error) {
                showError('Failed to load users');
            }
        }

        async function loadPrivateMessages(recipientId) {
            try {
                const messages = await apiCall(`/messages/private/${recipientId}`);
                const container = document.getElementById('messages-container');
                if (container) {
                    const user = AppState.getUser();
                    container.innerHTML = messages
                        .map(msg => createMessageHTML(msg, msg.senderName === user.username))
                        .join('');
                    container.scrollTop = container.scrollHeight;
                }
            } catch (error) {
                showError('Failed to load conversation');
            }
        }

        function sendMessage(event) {
            event.preventDefault();

            const input = document.getElementById('message-input');
            const content = input.value;

            try {
                const validContent = validateMessageContent(content);

                if (!AppState.stompClient) {
                    throw new Error('Not connected to chat');
                }

                const message = {
                    content: validContent,
                    recipientId: AppState.isPrivateMode && AppState.selectedUser
                        ? AppState.selectedUser.id
                        : null
                };

                const destination = AppState.isPrivateMode ? '/app/private-message' : '/app/message';
                AppState.stompClient.send(destination, {}, JSON.stringify(message));

                input.value = '';
                input.focus();

            } catch (error) {
                showError(error.message);
            }
        }

        async function selectUser(userId, username) {
            AppState.selectedUser = { id: userId, username };
            AppState.isPrivateMode = true;

            await loadPrivateMessages(userId);
            renderChat();
            setupChatListeners();
        }

        async function switchToPublic() {
            AppState.selectedUser = null;
            AppState.isPrivateMode = false;

            await loadPublicMessages();
            renderChat();
            setupChatListeners();
        }

        function logout() {
            if (AppState.stompClient) {
                AppState.stompClient.disconnect();
            }
            AppState.clear();
            isLoginMode = true;
            renderAuth();
        }

        // ===== RENDER FUNCTIONS =====
        function renderAuth() {
            appElement.innerHTML = createAuthFormHTML(isLoginMode);
            document.getElementById('auth-form').addEventListener('submit', handleAuth);
        }

        function renderChat() {
            appElement.innerHTML = createChatInterfaceHTML();
        }

        function setupChatListeners() {
            const messageForm = document.getElementById('message-form');
            if (messageForm) {
                messageForm.addEventListener('submit', sendMessage);
            }
        }

        // ===== INITIALIZATION =====
        (async function init() {
            const user = AppState.getUser();

            if (user) {
                await initializeChat();
            } else {
                renderAuth();
            }
        })();
    </script>
</body>

</html>
