<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialDev Chat</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <div id="app"></div>

    <script>
        const API_URL = 'http://localhost:8080/api';
        const WS_URL = 'http://localhost:8080/ws-socialdev';
        const MAX_MESSAGE_LENGTH = 1000;

        // Application State
        const AppState = {
            user: null,
            stompClient: null,
            publicMessages: [],
            privateChats: {},
            users: [],
            selectedUser: null,
            activeTab: null,
            isConnecting: false,

            setUser(newUser) {
                this.user = newUser;
                if (newUser) {
                    localStorage.setItem('socialdev_user', JSON.stringify(newUser));
                } else {
                    localStorage.removeItem('socialdev_user');
                }
            },

            getUser() {
                if (!this.user) {
                    const saved = localStorage.getItem('socialdev_user');
                    if (saved) {
                        try {
                            this.user = JSON.parse(saved);
                        } catch (e) {
                            console.error('Failed to parse saved user:', e);
                            localStorage.removeItem('socialdev_user');
                        }
                    }
                }
                return this.user;
            },

            getCachedUsers() {
                try {
                    const cached = localStorage.getItem('socialdev_users');
                    if (cached) {
                        return JSON.parse(cached);
                    }
                } catch (e) {
                    console.error('Failed to parse cached users:', e);
                }
                return [];
            },

            setCachedUsers(userList) {
                try {
                    localStorage.setItem('socialdev_users', JSON.stringify(userList));
                } catch (e) {
                    console.error('Failed to cache users:', e);
                }
            },

            reset() {
                if (this.stompClient) {
                    this.stompClient.disconnect();
                }
                this.user = null;
                this.stompClient = null;
                this.publicMessages = [];
                this.privateChats = {};
                this.users = [];
                this.selectedUser = null;
                this.activeTab = null;
                this.isConnecting = false;
                localStorage.removeItem('socialdev_user');
                localStorage.removeItem('socialdev_users');
            }
        };

        // Utility Functions
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function validateAuthInput(username, password) {
            if (!username || username.trim().length < 3) {
                throw new Error("Username must be at least 3 characters");
            }
            if (username.length > 20) {
                throw new Error("Username must be at most 20 characters");
            }
            if (!password || password.length < 5) {
                throw new Error("Password must be at least 5 characters");
            }
        }

        function validateMessageContent(content) {
            if (!content || content.trim().length === 0) {
                throw new Error("Message cannot be empty");
            }
            if (content.length > MAX_MESSAGE_LENGTH) {
                throw new Error(`Message cannot exceed ${MAX_MESSAGE_LENGTH} characters`);
            }
        }

        function showLoading(message = 'Loading...') {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen flex items-center justify-center bg-gray-100">
                    <div class="text-center">
                        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600 mx-auto"></div>
                        <p class="mt-4 text-gray-600">${escapeHtml(message)}</p>
                    </div>
                </div>
            `;
        }

        function showError(message, onRetry) {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen flex items-center justify-center bg-gray-100">
                    <div class="text-center max-w-md">
                        <div class="text-red-600 text-6xl mb-4">⚠️</div>
                        <p class="text-gray-800 text-lg mb-4">${escapeHtml(message)}</p>
                        ${onRetry ? `
                            <button onclick="(${onRetry})()" 
                                class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700 transition">
                                Retry
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // Initialize Application
        window.onload = () => {
            const savedUser = AppState.getUser();
            if (savedUser) {
                const cachedUsers = AppState.getCachedUsers();
                if (cachedUsers.length > 0) {
                    AppState.users = cachedUsers.filter(u => u.userId !== savedUser.userId);
                }
                connectWebSocket();
            } else {
                renderAuth();
            }

            // Global event delegation for Enter key
            document.addEventListener('keypress', handleGlobalKeyPress);
        };

        function handleGlobalKeyPress(e) {
            if (e.key === 'Enter') {
                const target = e.target;
                if (target.id === 'messageInput') {
                    sendMessage();
                } else if (target.id === 'password') {
                    const authBtn = document.getElementById('authBtn');
                    if (authBtn) authBtn.click();
                }
            }
        }

        // WebSocket Connection
        function connectWebSocket() {
            if (AppState.isConnecting) return;

            AppState.isConnecting = true;
            showLoading('Connecting to chat...');

            const socket = new SockJS(WS_URL);
            AppState.stompClient = Stomp.over(socket);

            // Disable debug logging
            AppState.stompClient.debug = null;

            AppState.stompClient.connect({}, onWebSocketConnect, onWebSocketError);
        }

        async function onWebSocketConnect() {
            console.log('Connected to WebSocket');
            AppState.isConnecting = false;

            try {
                await Promise.all([loadPublicMessages(), loadUsers()]);

                renderChat();

                // Subscribe to public messages
                AppState.stompClient.subscribe('/topic/public', (message) => {
                    try {
                        const msg = JSON.parse(message.body);
                        AppState.publicMessages.push(msg);
                        if (AppState.activeTab === 'public') {
                            renderMessages();
                        }
                    } catch (e) {
                        console.error('Failed to parse public message:', e);
                    }
                });

                // Subscribe to private messages
                AppState.stompClient.subscribe('/user/queue/private', (message) => {
                    try {
                        const msg = JSON.parse(message.body);
                        const otherUserId = msg.senderId === AppState.user.userId
                            ? msg.recipientId
                            : msg.senderId;

                        if (!AppState.privateChats[otherUserId]) {
                            AppState.privateChats[otherUserId] = [];
                        }
                        AppState.privateChats[otherUserId].push(msg);

                        if (AppState.activeTab === 'private' &&
                            AppState.selectedUser &&
                            AppState.selectedUser.userId === otherUserId) {
                            renderMessages();
                        }
                    } catch (e) {
                        console.error('Failed to parse private message:', e);
                    }
                });

            } catch (error) {
                console.error('Failed to initialize chat:', error);
                showError('Failed to load chat data', connectWebSocket);
            }
        }

        function onWebSocketError(error) {
            console.error('WebSocket connection error:', error);
            AppState.isConnecting = false;
            showError('Connection failed. Please check your network.', connectWebSocket);
        }

        // Authentication
        async function handleAuth(isLogin) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            errorDiv.textContent = '';

            try {
                validateAuthInput(username, password);

                const endpoint = isLogin ? '/auth/login' : '/auth/register';
                const response = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.message || (isLogin ? 'Login failed' : 'Registration failed'));
                }

                const user = await response.json();
                AppState.setUser(user);
                AppState.activeTab = null;
                AppState.selectedUser = null;

                connectWebSocket();
            } catch (err) {
                errorDiv.textContent = err.message;
            }
        }

        function switchAuthMode(isLogin) {
            const loginBtn = document.getElementById('loginBtn');
            const registerBtn = document.getElementById('registerBtn');
            const authBtn = document.getElementById('authBtn');
            const errorDiv = document.getElementById('error');

            errorDiv.textContent = '';

            if (isLogin) {
                loginBtn.className = "flex-1 py-2 rounded-lg font-semibold transition bg-purple-600 text-white";
                registerBtn.className = "flex-1 py-2 rounded-lg font-semibold transition bg-gray-200 text-gray-700";
                authBtn.textContent = "Login";
                authBtn.onclick = () => handleAuth(true);
            } else {
                loginBtn.className = "flex-1 py-2 rounded-lg font-semibold transition bg-gray-200 text-gray-700";
                registerBtn.className = "flex-1 py-2 rounded-lg font-semibold transition bg-purple-600 text-white";
                authBtn.textContent = "Register";
                authBtn.onclick = () => handleAuth(false);
            }
        }

        // Data Loading
        async function loadPublicMessages() {
            try {
                const response = await fetch(`${API_URL}/messages/public`, {
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Failed to load public messages');
                }

                AppState.publicMessages = await response.json();
            } catch (err) {
                console.error('Failed to load public messages:', err);
                AppState.publicMessages = [];
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch(`${API_URL}/users`, {
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Failed to load users');
                }

                const allUsers = await response.json();
                AppState.users = allUsers.filter(u => u.userId !== AppState.user.userId);
                AppState.setCachedUsers(AppState.users);
            } catch (err) {
                console.error('Failed to load users:', err);
                const cached = AppState.getCachedUsers();
                AppState.users = cached.filter(u => u.userId !== AppState.user.userId);
            }
        }

        async function loadPrivateMessages(recipientId) {
            try {
                const response = await fetch(`${API_URL}/messages/private/${recipientId}`, {
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Failed to load private messages');
                }

                AppState.privateChats[recipientId] = await response.json();
            } catch (err) {
                console.error('Failed to load private messages:', err);
                AppState.privateChats[recipientId] = [];
            }
        }

        // Messaging
        function sendMessage() {
            const input = document.getElementById('messageInput');
            if (!input) return;

            const content = input.value.trim();

            try {
                validateMessageContent(content);

                if (!AppState.stompClient || !AppState.stompClient.connected) {
                    throw new Error('Not connected to chat server. Please refresh the page.');
                }

                if (AppState.activeTab === 'public') {
                    AppState.stompClient.send('/app/message', {}, JSON.stringify({ content }));
                } else if (AppState.selectedUser) {
                    AppState.stompClient.send('/app/private-message', {}, JSON.stringify({
                        content,
                        recipientId: AppState.selectedUser.userId
                    }));
                }

                input.value = '';
            } catch (err) {
                alert(err.message);
            }
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                AppState.reset();
                renderAuth();
            }
        }

        async function selectUser(u) {
            AppState.selectedUser = u;
            AppState.activeTab = 'private';

            renderChat();

            if (!AppState.privateChats[u.userId]) {
                await loadPrivateMessages(u.userId);
                renderMessages();
            }
        }

        function switchToPublic() {
            AppState.activeTab = 'public';
            AppState.selectedUser = null;
            renderChat();
        }

        // Rendering Functions
        function renderAuth() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center p-4">
                    <div class="bg-white rounded-lg shadow-2xl p-8 w-full max-w-md">
                        <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">SocialDev Chat</h1>

                        <div class="flex gap-2 mb-6" role="tablist" aria-label="Authentication mode">
                            <button 
                                onclick="switchAuthMode(true)" 
                                id="loginBtn" 
                                role="tab"
                                aria-selected="true"
                                aria-controls="auth-panel"
                                class="flex-1 py-2 rounded-lg font-semibold transition bg-purple-600 text-white">
                                Login
                            </button>
                            <button 
                                onclick="switchAuthMode(false)" 
                                id="registerBtn"
                                role="tab"
                                aria-selected="false"
                                aria-controls="auth-panel"
                                class="flex-1 py-2 rounded-lg font-semibold transition bg-gray-200 text-gray-700">
                                Register
                            </button>
                        </div>

                        <div id="auth-panel" role="tabpanel" class="space-y-4">
                            <input 
                                type="text" 
                                id="username" 
                                placeholder="Username (3-20 characters)"
                                aria-label="Username"
                                autocomplete="username"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600">

                            <input 
                                type="password" 
                                id="password" 
                                placeholder="Password (minimum 5 characters)"
                                aria-label="Password"
                                autocomplete="current-password"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600">

                            <div 
                                id="error" 
                                role="alert" 
                                aria-live="polite"
                                class="text-red-600 text-sm min-h-[20px]"></div>

                            <button 
                                id="authBtn" 
                                onclick="handleAuth(true)" 
                                class="w-full bg-purple-600 text-white py-2 rounded-lg font-semibold hover:bg-purple-700 transition focus:outline-none focus:ring-2 focus:ring-purple-600 focus:ring-offset-2">
                                Login
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderChat() {
            const usersHtml = AppState.users.map(u => `
                <button 
                    onclick='selectUser(${JSON.stringify(u).replace(/'/g, "&#39;")})'
                    role="button"
                    aria-label="Chat with ${escapeHtml(u.username)}"
                    class="w-full text-left px-3 py-2 rounded-lg mb-1 transition focus:outline-none focus:ring-2 focus:ring-purple-600 ${AppState.selectedUser?.userId === u.userId && AppState.activeTab === 'private'
                    ? 'bg-purple-100 text-purple-700'
                    : 'hover:bg-gray-100'
                }">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 bg-green-500 rounded-full" aria-hidden="true"></div>
                        ${escapeHtml(u.username)}
                    </div>
                </button>
            `).join('');

            const showInput = AppState.activeTab === 'public' || AppState.selectedUser;

            document.getElementById('app').innerHTML = `
                <div class="h-screen bg-gray-100 flex overflow-hidden">
                    <!-- Sidebar -->
                    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col shrink-0" aria-label="Sidebar navigation">
                        <div class="p-4 border-b border-gray-200 shrink-0">
                            <h2 class="text-xl font-bold text-gray-800">SocialDev</h2>
                            <p class="text-sm text-gray-600">@${escapeHtml(AppState.user?.username || '...')}</p>
                            <button 
                                onclick="logout()" 
                                class="mt-2 w-full bg-red-500 text-white py-1 rounded text-sm hover:bg-red-600 transition focus:outline-none focus:ring-2 focus:ring-red-500"
                                aria-label="Logout">
                                Logout
                            </button>
                        </div>

                        <div class="p-4 border-b border-gray-200 shrink-0">
                            <button 
                                onclick="switchToPublic()" 
                                role="button"
                                aria-label="Public chat room"
                                class="w-full text-left px-3 py-2 rounded-lg font-medium transition focus:outline-none focus:ring-2 focus:ring-purple-600 ${AppState.activeTab === 'public'
                    ? 'bg-purple-100 text-purple-700'
                    : 'hover:bg-gray-100'
                }">
                                # Public Chat
                            </button>
                        </div>

                        <div class="flex-1 overflow-y-auto min-h-0">
                            <div class="p-4">
                                <h3 class="text-xs font-semibold text-gray-500 uppercase mb-2">Direct Messages</h3>
                                <nav aria-label="User list">
                                    ${usersHtml || '<p class="text-sm text-gray-500 px-3">No users online</p>'}
                                </nav>
                            </div>
                        </div>
                    </aside>

                    <!-- Main Chat Area -->
                    <main class="flex-1 flex flex-col min-h-0 min-w-0" role="main">
                        <header class="bg-white border-b border-gray-200 p-4 shrink-0">
                            <h2 class="text-xl font-bold text-gray-800">
                                ${AppState.activeTab === 'public'
                    ? '# Public Chat'
                    : (AppState.selectedUser
                        ? `@ ${escapeHtml(AppState.selectedUser.username)}`
                        : 'Select a chat to start messaging')
                }
                            </h2>
                        </header>

                        <div 
                            id="messages" 
                            role="log" 
                            aria-live="polite" 
                            aria-relevant="additions"
                            class="flex-1 overflow-y-auto p-4 space-y-3 min-h-0">
                        </div>

                        <footer class="bg-white border-t border-gray-200 p-4 shrink-0">
                            ${showInput
                    ? `
                                    <div class="flex gap-2">
                                        <input 
                                            type="text" 
                                            id="messageInput" 
                                            placeholder="Type a message..."
                                            aria-label="Message input"
                                            maxlength="${MAX_MESSAGE_LENGTH}"
                                            class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600">
                                        <button 
                                            onclick="sendMessage()" 
                                            aria-label="Send message"
                                            class="bg-purple-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-purple-700 transition focus:outline-none focus:ring-2 focus:ring-purple-600">
                                            Send
                                        </button>
                                    </div>
                                `
                    : `
                                    <div class="text-center text-gray-500 py-8">
                                        Please select a chat (Public or a user) to start messaging.
                                    </div>
                                `
                }
                        </footer>
                    </main>
                </div>
            `;

            renderMessages();
        }

        function renderMessages() {
            const currentMessages = AppState.activeTab === 'public'
                ? AppState.publicMessages
                : (AppState.selectedUser ? AppState.privateChats[AppState.selectedUser.userId] || [] : []);

            const messagesHtml = currentMessages.map(msg => {
                const isOwn = msg.senderId === AppState.user.userId;
                const timestamp = new Date(msg.createdAt).toLocaleTimeString([], {
                    hour: '2-digit',
                    minute: '2-digit'
                });

                return `
                    <div class="flex ${isOwn ? 'justify-end' : 'justify-start'}" role="article" aria-label="Message from ${escapeHtml(msg.senderName)}">
                        <div class="max-w-xs lg:max-w-md ${isOwn ? 'bg-purple-600 text-white' : 'bg-white'
                    } rounded-lg px-4 py-2 shadow">
                            ${!isOwn
                        ? `<div class="text-xs font-semibold mb-1 text-gray-600">
                                    ${escapeHtml(msg.senderName)}
                                   </div>`
                        : ''
                    }
                            <div class="break-words">${escapeHtml(msg.content)}</div>
                            <div class="text-xs mt-1 ${isOwn ? 'text-purple-200' : 'text-gray-500'}">
                                ${timestamp}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            const messagesDiv = document.getElementById('messages');
            if (messagesDiv) {
                if (messagesHtml) {
                    messagesDiv.innerHTML = messagesHtml;
                } else {
                    messagesDiv.innerHTML = `
                        <div class="text-center text-gray-500 py-8">
                            ${AppState.activeTab === 'public'
                            ? 'No messages yet. Be the first to say something!'
                            : 'No messages yet. Start the conversation!'}
                        </div>
                    `;
                }
                
                requestAnimationFrame(() => {
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                });
            }
        }
    </script>
</body>

</html>
